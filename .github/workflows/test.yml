name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Словарь и токенизация зависят от юникода и путей, поэтому один прогон
          # на macOS и один на Windows — там и всплывают расхождения.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Тесты
        run: pytest -q

      - name: Проверка встроенного словаря
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          from sakhaspell import SpellChecker, Lexicon
          lex = Lexicon.load()
          assert len(lex.core) > 290000, f'ядро подозрительно мало: {len(lex.core)}'
          assert len(lex.shadow) > 4000, f'теней мало: {len(lex.shadow)}'
          ch = SpellChecker(lex)
          # эти пары ловятся словарём и не должны сломаться незаметно
          for bad, good in [
              ('Ого уорэгэ кисиэхэ сана кыагы биэрэр', 'Оҕо үөрэҕэ киһиэхэ саҥа кыаҕы биэрэр'),
              ('Биьиги эьиги туьунан уьу', 'Биһиги эһиги туһунан үһү'),
              ('Мин огом онгор кун', 'Мин оҕом оҥор күн'),
          ]:
              got = ch.correct(bad)
              assert got == good, f'{bad!r} -> {got!r}, ждали {good!r}'
          # правильный текст трогать нельзя
          clean = 'Саха сирин олохтоохторо бу сайын үлэлээбиттэрин туһунан кэпсээтилэр'
          assert ch.correct(clean) == clean, ch.correct(clean)
          print('словарь на месте:', len(lex.core), 'форм')
          "

      - name: Консольная команда
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          sakhaspell check "Ого уорэгэ" || test $? -eq 1
          echo "Биьиги" | sakhaspell fix

  # Словарный слой обязан работать без единой зависимости. Проверяем отдельной
  # задачей, потому что в среде с torch этого не заметить: он подтягивается
  # первым же импортом и всё выглядит рабочим.
  no-deps:
    name: Установка без зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Собираем отдельным интерпретатором: иначе build и его зависимости
      # осядут в том же окружении и проверка на чистоту поймает их, а не нас.
      - name: Сборка колеса
        run: |
          python -m venv /tmp/buildenv
          /tmp/buildenv/bin/pip install -q build
          /tmp/buildenv/bin/python -m build --wheel --outdir dist

      - name: Установка в чистое окружение
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl

      - name: Ни одной сторонней зависимости
        run: |
          EXTRA=$(/tmp/clean/bin/pip list --format=freeze \
                  | grep -viE '^(pip|setuptools|wheel|sakhaspell)==' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::подтянулись лишние пакеты:"; echo "$EXTRA"; exit 1
          fi
          echo "зависимостей нет, как и задумано"

      - name: Работает без torch
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd /tmp
          /tmp/clean/bin/python -c "
          import importlib.util
          assert importlib.util.find_spec('torch') is None, 'torch не должен быть установлен'
          from sakhaspell import SpellChecker, Lexicon
          from sakhaspell.tagger import make_tags, apply_tags
          ch = SpellChecker(Lexicon.load())
          assert ch.correct('Ого уорэгэ') == 'Оҕо үөрэҕэ'
          assert apply_tags('ого', make_tags('ого', 'оҕо')) == 'оҕо'
          print('словарный слой и разметка работают без torch')
          "
          /tmp/clean/bin/sakhaspell check "сана" || test $? -eq 1
